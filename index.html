<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kurye Asistanı PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = { theme: { extend: { colors: { darkBg: '#0f172a', cardBg: '#1e293b', brandBlue: '#3b82f6', brandGreen: '#10b981', brandRed: '#ef4444', brandOrange: '#f59e0b', brandPurple: '#8b5cf6' } } } }
    </script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-darkBg text-white font-sans h-screen flex flex-col overflow-hidden">

    <!-- Üst Header -->
    <header class="bg-cardBg shadow-lg p-4 flex justify-between items-center border-b border-gray-800 z-10 shrink-0">
        <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brandBlue to-brandGreen">
            <i class="fa-solid fa-bolt text-brandOrange mr-1"></i> Asistan PRO
        </h1>
        <div class="flex gap-2">
            <button onclick="window.open('https://mgm.gov.tr/tahmin/il-ve-ilceler.aspx?il=Uşak', '_blank')" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded-lg text-sm shadow-lg">
                <i class="fa-solid fa-cloud-sun-rain"></i>
            </button>
            <button onclick="showHistory()" class="bg-brandBlue hover:bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm shadow-lg">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </button>
            <button onclick="showZReport()" class="bg-brandOrange hover:bg-orange-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold shadow-lg">
                Z Raporu
            </button>
        </div>
    </header>

    <!-- Ana İçerik -->
    <main class="flex-1 overflow-y-auto p-4 pb-24 space-y-5">
        
        <!-- SEKME 1: ANA SAYFA -->
        <div id="tab-home" class="tab-content active space-y-5">
            
            <div class="bg-cardBg p-4 rounded-xl border border-gray-700 shadow-md">
                <div class="flex justify-between text-sm mb-2">
                    <span class="text-gray-400 font-semibold">Günlük Kazanç Hedefi</span>
                    <span class="text-brandGreen font-bold"><span id="targetCurrent">0</span> / 1500 ₺</span>
                </div>
                <div class="w-full bg-gray-800 rounded-full h-2.5">
                    <div id="targetBar" class="bg-gradient-to-r from-brandBlue to-brandGreen h-2.5 rounded-full" style="width: 0%"></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-cardBg p-3 rounded-xl border-l-4 border-brandBlue shadow-sm">
                    <p class="text-gray-400 text-[10px] font-bold mb-1">KASAYA VERİLECEK NAKİT</p>
                    <p class="text-xl font-bold" id="shopTotal">0 ₺</p>
                </div>
                <div class="bg-cardBg p-3 rounded-xl border-l-4 border-brandGreen shadow-sm">
                    <p class="text-gray-400 text-[10px] font-bold mb-1">NET KAZANCIN (Senin)</p>
                    <p class="text-xl font-bold text-brandGreen" id="courierNet">0 ₺</p>
                </div>
                <div class="bg-cardBg p-3 rounded-xl border-l-4 border-brandPurple shadow-sm">
                    <p class="text-gray-400 text-[10px] font-bold mb-1">TOPLAM BAHŞİŞ</p>
                    <p class="text-xl font-bold text-brandPurple" id="tipTotal">0 ₺</p>
                </div>
                <div class="bg-cardBg p-3 rounded-xl border-l-4 border-brandRed shadow-sm">
                    <p class="text-gray-400 text-[10px] font-bold mb-1">TOPLAM MASRAF</p>
                    <p class="text-xl font-bold text-brandRed" id="expenseTotal">0 ₺</p>
                </div>
            </div>

            <!-- PAKET GİRİŞ ALANI -->
            <div class="bg-cardBg p-4 rounded-xl shadow-lg border border-gray-700 relative">
                <div class="flex justify-between items-center mb-3 border-b border-gray-700 pb-2">
                    <h2 class="
